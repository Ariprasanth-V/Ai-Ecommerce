# ============================================================
# AI-Commerce — DEV Profile
# ============================================================
# Uses local PostgreSQL by default (matches docker-compose / standalone container).
# Override with DB_URL, DB_USER, DB_PASSWORD env vars if needed.
# ============================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aicommerce}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.yourname.aicommerce: DEBUG
    org.springframework.security: DEBUG

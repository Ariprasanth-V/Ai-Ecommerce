# ============================================================
# AI-Commerce — DEV Profile
# ============================================================
# Uses H2 in-memory by default so the app starts without Postgres.
# Switch to Postgres by setting DB_URL, DB_USER, DB_PASSWORD env vars.
# ============================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:aicommerce;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.yourname.aicommerce: DEBUG
    org.springframework.security: DEBUG

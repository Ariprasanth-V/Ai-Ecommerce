# ============================================================
# AI-Commerce — TEST Profile
# ============================================================
# Uses H2 in-memory. Flyway is disabled; Hibernate manages the schema.
# Will migrate to Testcontainers + Postgres in a dedicated testing phase.
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:aicommerce-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

logging:
  level:
    com.yourname.aicommerce: WARN

app:
  jwt:
    secret: dGVzdHNlY3JldGtleXRlc3RzZWNyZXRrZXl0ZXN0c2VjcmV0a2V5dGVzdHNlY3JldGtleQ==
  razorpay:
    key-id: rzp_test_dummy
    key-secret: test_key_secret_dummy
    webhook-secret: test_webhook_secret_dummy

